name: Deploy Glaceon API

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - prod

env:
  AWS_REGION: ap-northeast-1
  NODE_VERSION: '20'

jobs:
  test:
    name: Test & Build
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: package-lock.json
      
      - name: Install dependencies
        run: npm ci
      
      - name: Build TypeScript
        run: npm run build
      
      - name: Lint code
        run: npm run lint || echo "Linting skipped - no lint script"
      
      - name: Run tests
        run: npm test || echo "Tests skipped - no test script"
      
      - name: Cache build artifacts
        uses: actions/cache@v3
        with:
          path: |
            lib
            node_modules
          key: ${{ runner.os }}-build-${{ hashFiles('package-lock.json') }}-${{ github.sha }}

  deploy-dev:
    name: Deploy to Development
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/develop' || (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'dev')
    environment: 
      name: development
      url: ${{ steps.deploy.outputs.api-url }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: package-lock.json
      
      - name: Restore build cache
        uses: actions/cache@v3
        with:
          path: |
            lib
            node_modules
          key: ${{ runner.os }}-build-${{ hashFiles('package-lock.json') }}-${{ github.sha }}
      
      - name: Install dependencies (if cache miss)
        run: |
          if [ ! -d "node_modules" ]; then
            npm ci
          fi
      
      - name: Build TypeScript (if cache miss)
        run: |
          if [ ! -d "lib" ]; then
            npm run build
          fi
      
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
      
      - name: Install AWS CDK
        run: npm install -g aws-cdk
      
      - name: Cleanup failed CDK bootstrap (if exists)
        run: |
          echo "🔍 Checking CDK bootstrap status..."
          
          # Check if CDKToolkit stack exists and its status
          STACK_STATUS=$(aws cloudformation describe-stacks --stack-name CDKToolkit --region ${{ env.AWS_REGION }} --query 'Stacks[0].StackStatus' --output text 2>/dev/null || echo "NOT_EXISTS")
          
          echo "CDKToolkit stack status: $STACK_STATUS"
          
          if [ "$STACK_STATUS" = "ROLLBACK_COMPLETE" ] || [ "$STACK_STATUS" = "CREATE_FAILED" ] || [ "$STACK_STATUS" = "UPDATE_FAILED" ]; then
            echo "🧹 Cleaning up failed CDKToolkit stack..."
            aws cloudformation delete-stack --stack-name CDKToolkit --region ${{ env.AWS_REGION }}
            
            echo "⏳ Waiting for cleanup to complete (max 10 minutes)..."
            timeout 600 aws cloudformation wait stack-delete-complete --stack-name CDKToolkit --region ${{ env.AWS_REGION }} || {
              echo "⚠️ Timeout waiting for deletion, but continuing..."
            }
            
            echo "✅ Cleanup completed"
          elif [ "$STACK_STATUS" = "NOT_EXISTS" ]; then
            echo "ℹ️ CDKToolkit stack does not exist - first time deployment"
          else
            echo "ℹ️ CDKToolkit stack exists with status: $STACK_STATUS"
          fi
      
      - name: Create environment file
        run: |
          cat > .env << EOF
          STRIPE_SECRET_KEY=${{ secrets.STRIPE_SECRET_KEY_DEV }}
          STRIPE_WEBHOOK_SECRET=${{ secrets.STRIPE_WEBHOOK_SECRET_DEV }}
          NODE_ENV=development
          EOF
      
      - name: Deploy to development
        id: deploy
        run: |
          chmod +x deploy.sh
          
          # Try deployment, with fallback to force bootstrap if needed
          set +e
          ./deploy.sh --environment dev --ci
          DEPLOY_STATUS=$?
          set -e
          
          if [ $DEPLOY_STATUS -ne 0 ]; then
            echo "⚠️ Initial deployment failed, trying with force bootstrap..."
            ./deploy.sh --environment dev --ci --force-bootstrap
          fi
          
          # Extract API URL from CDK outputs
          if [ -f "cdk-outputs.json" ]; then
            API_URL=$(cat cdk-outputs.json | jq -r '.[] | .ApiUrl // empty')
            echo "api-url=$API_URL" >> $GITHUB_OUTPUT
            echo "🚀 Development API URL: $API_URL"
            
            # Add to job summary
            echo "## 🚀 Development Deployment Success" >> $GITHUB_STEP_SUMMARY
            echo "**API URL:** $API_URL" >> $GITHUB_STEP_SUMMARY
            echo "**Environment:** Development" >> $GITHUB_STEP_SUMMARY
            echo "**Region:** ${{ env.AWS_REGION }}" >> $GITHUB_STEP_SUMMARY
          fi
      
      - name: Comment PR with deployment info
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const apiUrl = '${{ steps.deploy.outputs.api-url }}';
            if (apiUrl) {
              github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: `🚀 **Development deployment successful!**\n\nAPI URL: ${apiUrl}\n\nYou can test the API endpoints now.`
              });
            }

  deploy-prod:
    name: Deploy to Production
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'prod')
    environment: 
      name: production
      url: ${{ steps.deploy.outputs.api-url }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: package-lock.json
      
      - name: Restore build cache
        uses: actions/cache@v3
        with:
          path: |
            lib
            node_modules
          key: ${{ runner.os }}-build-${{ hashFiles('package-lock.json') }}-${{ github.sha }}
      
      - name: Install dependencies (if cache miss)
        run: |
          if [ ! -d "node_modules" ]; then
            npm ci
          fi
      
      - name: Build TypeScript (if cache miss)
        run: |
          if [ ! -d "lib" ]; then
            npm run build
          fi
      
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID_PROD }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY_PROD }}
          aws-region: ${{ env.AWS_REGION }}
      
      - name: Install AWS CDK
        run: npm install -g aws-cdk
      
      - name: Cleanup failed CDK bootstrap (if exists)
        run: |
          echo "🔍 Checking CDK bootstrap status..."
          
          # Check if CDKToolkit stack exists and its status
          STACK_STATUS=$(aws cloudformation describe-stacks --stack-name CDKToolkit --region ${{ env.AWS_REGION }} --query 'Stacks[0].StackStatus' --output text 2>/dev/null || echo "NOT_EXISTS")
          
          echo "CDKToolkit stack status: $STACK_STATUS"
          
          if [ "$STACK_STATUS" = "ROLLBACK_COMPLETE" ] || [ "$STACK_STATUS" = "CREATE_FAILED" ] || [ "$STACK_STATUS" = "UPDATE_FAILED" ]; then
            echo "🧹 Cleaning up failed CDKToolkit stack..."
            aws cloudformation delete-stack --stack-name CDKToolkit --region ${{ env.AWS_REGION }}
            
            echo "⏳ Waiting for cleanup to complete (max 10 minutes)..."
            timeout 600 aws cloudformation wait stack-delete-complete --stack-name CDKToolkit --region ${{ env.AWS_REGION }} || {
              echo "⚠️ Timeout waiting for deletion, but continuing..."
            }
            
            echo "✅ Cleanup completed"
          elif [ "$STACK_STATUS" = "NOT_EXISTS" ]; then
            echo "ℹ️ CDKToolkit stack does not exist - first time deployment"
          else
            echo "ℹ️ CDKToolkit stack exists with status: $STACK_STATUS"
          fi
      
      - name: Create production environment file
        run: |
          cat > .env.production << EOF
          STRIPE_SECRET_KEY=${{ secrets.STRIPE_SECRET_KEY_PROD }}
          STRIPE_WEBHOOK_SECRET=${{ secrets.STRIPE_WEBHOOK_SECRET_PROD }}
          NODE_ENV=production
          EOF
      
      - name: Deploy to production
        id: deploy
        run: |
          chmod +x deploy.sh
          
          # Try deployment, with fallback to force bootstrap if needed
          set +e
          ./deploy.sh --environment prod --ci
          DEPLOY_STATUS=$?
          set -e
          
          if [ $DEPLOY_STATUS -ne 0 ]; then
            echo "⚠️ Initial deployment failed, trying with force bootstrap..."
            ./deploy.sh --environment prod --ci --force-bootstrap
          fi
          
          # Extract API URL from CDK outputs
          if [ -f "cdk-outputs.json" ]; then
            API_URL=$(cat cdk-outputs.json | jq -r '.[] | .ApiUrl // empty')
            echo "api-url=$API_URL" >> $GITHUB_OUTPUT
            echo "🚀 Production API URL: $API_URL"
            
            # Add to job summary
            echo "## 🚀 Production Deployment Success" >> $GITHUB_STEP_SUMMARY
            echo "**API URL:** $API_URL" >> $GITHUB_STEP_SUMMARY
            echo "**Environment:** Production" >> $GITHUB_STEP_SUMMARY
            echo "**Region:** ${{ env.AWS_REGION }}" >> $GITHUB_STEP_SUMMARY
          fi
      
      - name: Create GitHub Release
        if: github.ref == 'refs/heads/main'
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: api-v${{ github.run_number }}
          release_name: API Release v${{ github.run_number }}
          body: |
            🚀 **Production deployment successful!**
            
            **API URL:** ${{ steps.deploy.outputs.api-url }}
            
            **Changes in this release:**
            ${{ github.event.head_commit.message }}
            
            **Commit:** ${{ github.sha }}
          draft: false
          prerelease: false

  cleanup:
    name: Cleanup
    runs-on: ubuntu-latest
    if: always()
    needs: [deploy-dev, deploy-prod]
    
    steps:
      - name: Cleanup temporary files
        run: |
          rm -f .env .env.production cdk-outputs.json || true