name: Deploy SAM Application

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  AWS_REGION: ap-northeast-1
  STACK_NAME: glaceon-api-dev

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'

    - name: Install dependencies
      run: |
        cd src
        npm ci --production

    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'

    - name: Setup SAM CLI
      uses: aws-actions/setup-sam@v2
      with:
        use-installer: true

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ env.AWS_REGION }}

    - name: Validate SAM template
      run: sam validate --template-file template.yaml

    - name: Build SAM application
      run: sam build --template-file template.yaml

    - name: Check if stack exists and delete if in failed state
      run: |
        STACK_STATUS=$(aws cloudformation describe-stacks --stack-name ${{ env.STACK_NAME }} --region ${{ env.AWS_REGION }} --query 'Stacks[0].StackStatus' --output text 2>/dev/null || echo "DOES_NOT_EXIST")
        echo "Current stack status: $STACK_STATUS"
        
        if [ "$STACK_STATUS" = "ROLLBACK_COMPLETE" ] || [ "$STACK_STATUS" = "CREATE_FAILED" ] || [ "$STACK_STATUS" = "ROLLBACK_FAILED" ]; then
          echo "Stack is in failed state ($STACK_STATUS). Deleting stack..."
          aws cloudformation delete-stack --stack-name ${{ env.STACK_NAME }} --region ${{ env.AWS_REGION }}
          echo "Waiting for stack deletion to complete..."
          aws cloudformation wait stack-delete-complete --stack-name ${{ env.STACK_NAME }} --region ${{ env.AWS_REGION }}
          echo "Stack deleted successfully"
        elif [ "$STACK_STATUS" = "DOES_NOT_EXIST" ]; then
          echo "Stack does not exist. Will create new stack."
        else
          echo "Stack exists in good state ($STACK_STATUS). Will update."
        fi

    - name: Deploy SAM application
      run: |
        # Set default values if secrets are not provided
        STRIPE_SECRET_KEY="${{ secrets.STRIPE_SECRET_KEY }}"
        STRIPE_WEBHOOK_SECRET="${{ secrets.STRIPE_WEBHOOK_SECRET }}"
        
        if [ -z "$STRIPE_SECRET_KEY" ]; then
          STRIPE_SECRET_KEY="sk_test_placeholder"
        fi
        
        if [ -z "$STRIPE_WEBHOOK_SECRET" ]; then
          STRIPE_WEBHOOK_SECRET="whsec_placeholder"
        fi
        
        sam deploy \
          --template-file template.yaml \
          --stack-name ${{ env.STACK_NAME }} \
          --region ${{ env.AWS_REGION }} \
          --capabilities CAPABILITY_IAM \
          --parameter-overrides \
            Environment=dev \
            StripeSecretKey="$STRIPE_SECRET_KEY" \
            StripeWebhookSecret="$STRIPE_WEBHOOK_SECRET" \
          --no-confirm-changeset \
          --no-fail-on-empty-changeset \
          --resolve-s3

    - name: Get stack outputs
      run: |
        echo "=== Stack Outputs ==="
        aws cloudformation describe-stacks \
          --stack-name ${{ env.STACK_NAME }} \
          --region ${{ env.AWS_REGION }} \
          --query 'Stacks[0].Outputs' \
          --output table

    - name: Test API endpoint
      run: |
        API_URL=$(aws cloudformation describe-stacks \
          --stack-name ${{ env.STACK_NAME }} \
          --region ${{ env.AWS_REGION }} \
          --query 'Stacks[0].Outputs[?OutputKey==`ApiUrl`].OutputValue' \
          --output text)
        echo "API URL: $API_URL"
        
        # Basic health check (optional)
        # curl -f "$API_URL/health" || echo "Health check endpoint not available"