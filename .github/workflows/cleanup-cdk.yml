name: Cleanup CDK Resources

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to cleanup'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - prod
          - all
      confirm_cleanup:
        description: 'Type "CONFIRM" to proceed with cleanup'
        required: true
        type: string
      force_cleanup:
        description: 'Force cleanup even if resources are in use'
        required: false
        default: false
        type: boolean

env:
  AWS_REGION: ap-northeast-1

jobs:
  cleanup-cdk:
    name: Cleanup CDK Resources
    runs-on: ubuntu-latest
    if: github.event.inputs.confirm_cleanup == 'CONFIRM'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Configure AWS credentials for development
        if: github.event.inputs.environment == 'dev' || github.event.inputs.environment == 'all'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
      
      - name: Cleanup development CDK resources
        if: github.event.inputs.environment == 'dev' || github.event.inputs.environment == 'all'
        run: |
          chmod +x scripts/cleanup-cdk.sh
          ./scripts/cleanup-cdk.sh --ci
          
          echo "## 🧹 Development CDK Cleanup Results" >> $GITHUB_STEP_SUMMARY
          echo "- **Environment:** Development" >> $GITHUB_STEP_SUMMARY
          echo "- **Region:** ${{ env.AWS_REGION }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Status:** ✅ Completed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
      
      - name: Configure AWS credentials for production
        if: github.event.inputs.environment == 'prod' || github.event.inputs.environment == 'all'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID_PROD }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY_PROD }}
          aws-region: ${{ env.AWS_REGION }}
      
      - name: Cleanup production CDK resources
        if: github.event.inputs.environment == 'prod' || github.event.inputs.environment == 'all'
        run: |
          chmod +x scripts/cleanup-cdk.sh
          ./scripts/cleanup-cdk.sh --ci
          
          echo "## 🧹 Production CDK Cleanup Results" >> $GITHUB_STEP_SUMMARY
          echo "- **Environment:** Production" >> $GITHUB_STEP_SUMMARY
          echo "- **Region:** ${{ env.AWS_REGION }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Status:** ✅ Completed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
      
      - name: Create cleanup report
        run: |
          echo "## 🎉 CDK Cleanup Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Cleanup completed for:** ${{ github.event.inputs.environment }}" >> $GITHUB_STEP_SUMMARY
          echo "**Force cleanup:** ${{ github.event.inputs.force_cleanup }}" >> $GITHUB_STEP_SUMMARY
          echo "**Triggered by:** @${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
          echo "**Timestamp:** $(date -u '+%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Next Steps" >> $GITHUB_STEP_SUMMARY
          echo "1. Verify cleanup in AWS Console" >> $GITHUB_STEP_SUMMARY
          echo "2. Run SAM deployment if needed" >> $GITHUB_STEP_SUMMARY
          echo "3. Test API endpoints" >> $GITHUB_STEP_SUMMARY

  cleanup-validation:
    name: Validate Cleanup Input
    runs-on: ubuntu-latest
    if: github.event.inputs.confirm_cleanup != 'CONFIRM'
    
    steps:
      - name: Invalid confirmation
        run: |
          echo "❌ Cleanup cancelled - confirmation input was: '${{ github.event.inputs.confirm_cleanup }}'"
          echo "Please type 'CONFIRM' exactly to proceed with cleanup."
          echo ""
          echo "## ⚠️ Cleanup Cancelled" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Cleanup was cancelled because the confirmation input was incorrect." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Expected:** CONFIRM" >> $GITHUB_STEP_SUMMARY
          echo "**Received:** ${{ github.event.inputs.confirm_cleanup }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Please re-run the workflow with the correct confirmation." >> $GITHUB_STEP_SUMMARY
          exit 1