AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: 'Glaceon API - S3 Glacier Deep Archive API for mobile applications'

Parameters:
  Environment:
    Type: String
    Default: dev
    AllowedValues: [dev, staging, prod]
    Description: Environment name
  
  StripeSecretKey:
    Type: String
    NoEcho: true
    Description: Stripe Secret Key
    Default: sk_test_placeholder
  
  StripeWebhookSecret:
    Type: String
    NoEcho: true
    Description: Stripe Webhook Secret
    Default: whsec_placeholder

Globals:
  Function:
    Timeout: 30
    Runtime: nodejs18.x
    Environment:
      Variables:
        NODE_OPTIONS: '--enable-source-maps'
        NODE_ENV: !Ref Environment
        STRIPE_SECRET_KEY: !Ref StripeSecretKey
        STRIPE_WEBHOOK_SECRET: !Ref StripeWebhookSecret

Resources:
  # Cognito User Pool
  UserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Sub 'glacier-archive-users-${Environment}'
      AutoVerifiedAttributes:
        - email
      UsernameAttributes:
        - email
        - username
      EmailConfiguration:
        EmailSendingAccount: COGNITO_DEFAULT
      Policies:
        PasswordPolicy:
          MinimumLength: 8
          RequireLowercase: true
          RequireUppercase: true
          RequireNumbers: true
          RequireSymbols: false
      AccountRecoverySetting:
        RecoveryMechanisms:
          - Name: verified_email
            Priority: 1

  # Cognito User Pool Client
  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      UserPoolId: !Ref UserPool
      ClientName: !Sub 'glacier-archive-client-${Environment}'
      GenerateSecret: false
      ExplicitAuthFlows:
        - ALLOW_USER_PASSWORD_AUTH
        - ALLOW_USER_SRP_AUTH
        - ALLOW_CUSTOM_AUTH
        - ALLOW_ADMIN_USER_PASSWORD_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH
      RefreshTokenValidity: 30
      AccessTokenValidity: 60
      IdTokenValidity: 60
      TokenValidityUnits:
        RefreshToken: days
        AccessToken: minutes
        IdToken: minutes

  # DynamoDB Tables
  ArchiveMetadataTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub 'glacier-archive-metadata-${Environment}'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: userId
          AttributeType: S
        - AttributeName: archiveId
          AttributeType: S
      KeySchema:
        - AttributeName: userId
          KeyType: HASH
        - AttributeName: archiveId
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: ArchiveIdIndex
          KeySchema:
            - AttributeName: archiveId
              KeyType: HASH
          Projection:
            ProjectionType: ALL
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      DeletionProtectionEnabled: true

  CustomerTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub 'glacier-customers-${Environment}'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: userId
          AttributeType: S
        - AttributeName: stripeCustomerId
          AttributeType: S
      KeySchema:
        - AttributeName: userId
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: StripeCustomerIndex
          KeySchema:
            - AttributeName: stripeCustomerId
              KeyType: HASH
          Projection:
            ProjectionType: ALL
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      DeletionProtectionEnabled: true

  UsageTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub 'glacier-usage-${Environment}'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: userId
          AttributeType: S
        - AttributeName: periodMonth
          AttributeType: S
      KeySchema:
        - AttributeName: userId
          KeyType: HASH
        - AttributeName: periodMonth
          KeyType: RANGE
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      DeletionProtectionEnabled: true

  UsageEventsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub 'glacier-usage-events-${Environment}'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: userId
          AttributeType: S
        - AttributeName: timestamp
          AttributeType: S
      KeySchema:
        - AttributeName: userId
          KeyType: HASH
        - AttributeName: timestamp
          KeyType: RANGE
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true

  # S3 Bucket for Archives
  ArchiveBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub 'glacier-archive-${Environment}-${AWS::AccountId}'
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      LifecycleConfiguration:
        Rules:
          - Id: DeepArchiveRule
            Status: Enabled
            Filter:
              Prefix: archives/
            Transitions:
              - TransitionInDays: 1
                StorageClass: DEEP_ARCHIVE
          - Id: ThumbnailRule
            Status: Enabled
            Filter:
              Prefix: thumbnails/
            Transitions:
              - TransitionInDays: 30
                StorageClass: STANDARD_IA

  # CloudFront Distribution for Thumbnails
  ThumbnailDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: !Sub 'Thumbnail distribution for ${Environment}'
        DefaultCacheBehavior:
          TargetOriginId: S3Origin
          ViewerProtocolPolicy: redirect-to-https
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6  # Managed-CachingOptimized
          AllowedMethods: [GET, HEAD]
          CachedMethods: [GET, HEAD]
          Compress: true
        Origins:
          - Id: S3Origin
            DomainName: !GetAtt ArchiveBucket.RegionalDomainName
            OriginPath: /thumbnails
            S3OriginConfig:
              OriginAccessIdentity: !Sub 'origin-access-identity/cloudfront/${CloudFrontOriginAccessIdentity}'
        PriceClass: PriceClass_100
        HttpVersion: http2

  # CloudFront Origin Access Identity
  CloudFrontOriginAccessIdentity:
    Type: AWS::CloudFront::CloudFrontOriginAccessIdentity
    Properties:
      CloudFrontOriginAccessIdentityConfig:
        Comment: !Sub 'OAI for ${Environment} thumbnails'

  # S3 Bucket Policy for CloudFront
  ArchiveBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref ArchiveBucket
      PolicyDocument:
        Statement:
          - Sid: AllowCloudFrontAccess
            Effect: Allow
            Principal:
              AWS: !Sub 'arn:aws:iam::cloudfront:user/CloudFront Origin Access Identity ${CloudFrontOriginAccessIdentity}'
            Action: s3:GetObject
            Resource: !Sub '${ArchiveBucket}/thumbnails/*'

  # Lambda Functions
  UploadFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub 'glacier-upload-${Environment}'
      CodeUri: src/
      Handler: upload.handler
      Description: 'Upload files to Glacier Deep Archive'
      Environment:
        Variables:
          ARCHIVE_BUCKET: !Ref ArchiveBucket
          METADATA_TABLE: !Ref ArchiveMetadataTable
          CUSTOMER_TABLE: !Ref CustomerTable
          USAGE_TABLE: !Ref UsageTable
          USAGE_EVENTS_TABLE: !Ref UsageEventsTable
          USER_POOL_ID: !Ref UserPool
          USER_POOL_CLIENT_ID: !Ref UserPoolClient
          CLOUDFRONT_DOMAIN: !GetAtt ThumbnailDistribution.DomainName
      Policies:
        - S3WritePolicy:
            BucketName: !Ref ArchiveBucket
        - DynamoDBCrudPolicy:
            TableName: !Ref ArchiveMetadataTable
        - DynamoDBCrudPolicy:
            TableName: !Ref UsageTable
        - DynamoDBWritePolicy:
            TableName: !Ref UsageEventsTable
      Events:
        ApiEvent:
          Type: Api
          Properties:
            Path: /archive/upload
            Method: post

  ListFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub 'glacier-list-${Environment}'
      CodeUri: src/
      Handler: list.handler
      Description: 'List archived files'
      Environment:
        Variables:
          ARCHIVE_BUCKET: !Ref ArchiveBucket
          METADATA_TABLE: !Ref ArchiveMetadataTable
          CUSTOMER_TABLE: !Ref CustomerTable
          USAGE_TABLE: !Ref UsageTable
          USAGE_EVENTS_TABLE: !Ref UsageEventsTable
          USER_POOL_ID: !Ref UserPool
          USER_POOL_CLIENT_ID: !Ref UserPoolClient
          CLOUDFRONT_DOMAIN: !GetAtt ThumbnailDistribution.DomainName
      Policies:
        - S3ReadPolicy:
            BucketName: !Ref ArchiveBucket
        - DynamoDBReadPolicy:
            TableName: !Ref ArchiveMetadataTable
      Events:
        ApiEvent:
          Type: Api
          Properties:
            Path: /archive/list
            Method: get

  GetFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub 'glacier-get-${Environment}'
      CodeUri: src/
      Handler: get.handler
      Description: 'Get/restore archived files'
      Timeout: 60
      Environment:
        Variables:
          ARCHIVE_BUCKET: !Ref ArchiveBucket
          METADATA_TABLE: !Ref ArchiveMetadataTable
          CUSTOMER_TABLE: !Ref CustomerTable
          USAGE_TABLE: !Ref UsageTable
          USAGE_EVENTS_TABLE: !Ref UsageEventsTable
          USER_POOL_ID: !Ref UserPool
          USER_POOL_CLIENT_ID: !Ref UserPoolClient
          CLOUDFRONT_DOMAIN: !GetAtt ThumbnailDistribution.DomainName
      Policies:
        - S3CrudPolicy:
            BucketName: !Ref ArchiveBucket
        - DynamoDBReadPolicy:
            TableName: !Ref ArchiveMetadataTable
        - DynamoDBCrudPolicy:
            TableName: !Ref UsageTable
        - DynamoDBWritePolicy:
            TableName: !Ref UsageEventsTable
        - Statement:
            - Effect: Allow
              Action:
                - s3:RestoreObject
                - s3:GetObjectAttributes
              Resource: !Sub '${ArchiveBucket}/*'
      Events:
        ApiEvent:
          Type: Api
          Properties:
            Path: /archive/{archiveId}
            Method: get

  DeleteFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub 'glacier-delete-${Environment}'
      CodeUri: src/
      Handler: delete.handler
      Description: 'Delete archived files'
      Environment:
        Variables:
          ARCHIVE_BUCKET: !Ref ArchiveBucket
          METADATA_TABLE: !Ref ArchiveMetadataTable
          CUSTOMER_TABLE: !Ref CustomerTable
          USAGE_TABLE: !Ref UsageTable
          USAGE_EVENTS_TABLE: !Ref UsageEventsTable
          USER_POOL_ID: !Ref UserPool
          USER_POOL_CLIENT_ID: !Ref UserPoolClient
          CLOUDFRONT_DOMAIN: !GetAtt ThumbnailDistribution.DomainName
      Policies:
        - S3CrudPolicy:
            BucketName: !Ref ArchiveBucket
        - DynamoDBCrudPolicy:
            TableName: !Ref ArchiveMetadataTable
        - DynamoDBWritePolicy:
            TableName: !Ref UsageEventsTable
      Events:
        ApiEvent:
          Type: Api
          Properties:
            Path: /archive/{archiveId}
            Method: delete

  RegisterFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub 'glacier-register-${Environment}'
      CodeUri: src/
      Handler: register.handler
      Description: 'User registration and email verification'
      Environment:
        Variables:
          ARCHIVE_BUCKET: !Ref ArchiveBucket
          METADATA_TABLE: !Ref ArchiveMetadataTable
          CUSTOMER_TABLE: !Ref CustomerTable
          USAGE_TABLE: !Ref UsageTable
          USAGE_EVENTS_TABLE: !Ref UsageEventsTable
          USER_POOL_ID: !Ref UserPool
          USER_POOL_CLIENT_ID: !Ref UserPoolClient
          CLOUDFRONT_DOMAIN: !GetAtt ThumbnailDistribution.DomainName
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref CustomerTable
      Events:
        ApiEvent:
          Type: Api
          Properties:
            Path: /auth
            Method: post
        ApiEventLegacy:
          Type: Api
          Properties:
            Path: /auth/register
            Method: post

  BillingFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub 'glacier-billing-${Environment}'
      CodeUri: src/
      Handler: billing.handler
      Description: 'Stripe billing and subscription management'
      Environment:
        Variables:
          ARCHIVE_BUCKET: !Ref ArchiveBucket
          METADATA_TABLE: !Ref ArchiveMetadataTable
          CUSTOMER_TABLE: !Ref CustomerTable
          USAGE_TABLE: !Ref UsageTable
          USAGE_EVENTS_TABLE: !Ref UsageEventsTable
          USER_POOL_ID: !Ref UserPool
          USER_POOL_CLIENT_ID: !Ref UserPoolClient
          CLOUDFRONT_DOMAIN: !GetAtt ThumbnailDistribution.DomainName
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref CustomerTable
        - DynamoDBReadPolicy:
            TableName: !Ref UsageTable
      Events:
        ApiEvent:
          Type: Api
          Properties:
            Path: /billing
            Method: post

  UsageFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub 'glacier-usage-${Environment}'
      CodeUri: src/
      Handler: usage.handler
      Description: 'Usage tracking and reporting'
      Environment:
        Variables:
          ARCHIVE_BUCKET: !Ref ArchiveBucket
          METADATA_TABLE: !Ref ArchiveMetadataTable
          CUSTOMER_TABLE: !Ref CustomerTable
          USAGE_TABLE: !Ref UsageTable
          USAGE_EVENTS_TABLE: !Ref UsageEventsTable
          USER_POOL_ID: !Ref UserPool
          USER_POOL_CLIENT_ID: !Ref UserPoolClient
          CLOUDFRONT_DOMAIN: !GetAtt ThumbnailDistribution.DomainName
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref CustomerTable
        - DynamoDBCrudPolicy:
            TableName: !Ref UsageTable
        - DynamoDBCrudPolicy:
            TableName: !Ref UsageEventsTable
      Events:
        ApiEvent:
          Type: Api
          Properties:
            Path: /usage
            Method: post

  WebhookFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub 'glacier-webhook-${Environment}'
      CodeUri: src/
      Handler: webhook.handler
      Description: 'Stripe webhook processing'
      Environment:
        Variables:
          ARCHIVE_BUCKET: !Ref ArchiveBucket
          METADATA_TABLE: !Ref ArchiveMetadataTable
          CUSTOMER_TABLE: !Ref CustomerTable
          USAGE_TABLE: !Ref UsageTable
          USAGE_EVENTS_TABLE: !Ref UsageEventsTable
          USER_POOL_ID: !Ref UserPool
          USER_POOL_CLIENT_ID: !Ref UserPoolClient
          CLOUDFRONT_DOMAIN: !GetAtt ThumbnailDistribution.DomainName
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref CustomerTable
      Events:
        ApiEvent:
          Type: Api
          Properties:
            Path: /webhook/stripe
            Method: post

  ThumbnailFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub 'glacier-thumbnail-${Environment}'
      CodeUri: src/
      Handler: thumbnail-cloudfront.handler
      Description: 'Get thumbnail URLs (CloudFront)'
      Environment:
        Variables:
          ARCHIVE_BUCKET: !Ref ArchiveBucket
          METADATA_TABLE: !Ref ArchiveMetadataTable
          CUSTOMER_TABLE: !Ref CustomerTable
          USAGE_TABLE: !Ref UsageTable
          USAGE_EVENTS_TABLE: !Ref UsageEventsTable
          USER_POOL_ID: !Ref UserPool
          USER_POOL_CLIENT_ID: !Ref UserPoolClient
          CLOUDFRONT_DOMAIN: !GetAtt ThumbnailDistribution.DomainName
      Policies:
        - S3ReadPolicy:
            BucketName: !Ref ArchiveBucket
        - DynamoDBReadPolicy:
            TableName: !Ref ArchiveMetadataTable
      Events:
        ApiEvent:
          Type: Api
          Properties:
            Path: /archive/{archiveId}/thumbnail
            Method: get

  ThumbnailBatchFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub 'glacier-thumbnail-batch-${Environment}'
      CodeUri: src/
      Handler: thumbnail-cloudfront.handlerBatch
      Description: 'Get multiple thumbnail URLs (CloudFront)'
      Environment:
        Variables:
          ARCHIVE_BUCKET: !Ref ArchiveBucket
          METADATA_TABLE: !Ref ArchiveMetadataTable
          CUSTOMER_TABLE: !Ref CustomerTable
          USAGE_TABLE: !Ref UsageTable
          USAGE_EVENTS_TABLE: !Ref UsageEventsTable
          USER_POOL_ID: !Ref UserPool
          USER_POOL_CLIENT_ID: !Ref UserPoolClient
          CLOUDFRONT_DOMAIN: !GetAtt ThumbnailDistribution.DomainName
      Policies:
        - S3ReadPolicy:
            BucketName: !Ref ArchiveBucket
        - DynamoDBReadPolicy:
            TableName: !Ref ArchiveMetadataTable
      Events:
        ApiEvent:
          Type: Api
          Properties:
            Path: /archive/thumbnails/batch
            Method: post

  # API Gateway (Implicit)
  # SAM will create an implicit API Gateway for us

Outputs:
  ApiUrl:
    Description: 'API Gateway URL'
    Value: !Sub 'https://${ServerlessRestApi}.execute-api.${AWS::Region}.amazonaws.com/Prod/'
    Export:
      Name: !Sub '${AWS::StackName}-ApiUrl'

  BucketName:
    Description: 'S3 Archive Bucket Name'
    Value: !Ref ArchiveBucket
    Export:
      Name: !Sub '${AWS::StackName}-BucketName'

  Region:
    Description: 'AWS Region'
    Value: !Ref AWS::Region
    Export:
      Name: !Sub '${AWS::StackName}-Region'

  UserPoolId:
    Description: 'Cognito User Pool ID'
    Value: !Ref UserPool
    Export:
      Name: !Sub '${AWS::StackName}-UserPoolId'

  UserPoolClientId:
    Description: 'Cognito User Pool Client ID'
    Value: !Ref UserPoolClient
    Export:
      Name: !Sub '${AWS::StackName}-UserPoolClientId'

  CloudFrontDomain:
    Description: 'CloudFront Distribution Domain for Thumbnails'
    Value: !GetAtt ThumbnailDistribution.DomainName
    Export:
      Name: !Sub '${AWS::StackName}-CloudFrontDomain'

  CloudFrontDistributionId:
    Description: 'CloudFront Distribution ID'
    Value: !Ref ThumbnailDistribution
    Export:
      Name: !Sub '${AWS::StackName}-CloudFrontDistributionId'